name: stagelink-backend
x-node: &node
  image: stagelink-backend:foundation
  build:
    context: ..
    dockerfile: backend/Dockerfile
  init: true
  environment: &node-env
    NODE_ENV: development
    AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Run node backend/scripts/setup-env.mjs}
    AUTH_MAIL_KEY: ${AUTH_MAIL_KEY:?Run node backend/scripts/setup-env.mjs}
    PAYOUT_DATA_KEY: ${PAYOUT_DATA_KEY:?Run node backend/scripts/setup-env.mjs}
    MEDIA_DRIVER: local-s3
    S3_ENDPOINT: http://storage:9090
    S3_BUCKET: stagelink-media
    PROMOTIONAL_UNSUBSCRIBE_ORIGIN: ${PROMOTIONAL_UNSUBSCRIBE_ORIGIN:-}
    PROMOTIONAL_EMAIL_DELIVERY: ${PROMOTIONAL_EMAIL_DELIVERY:-false}
    PROMOTIONAL_EMAIL_HOURLY_LIMIT: ${PROMOTIONAL_EMAIL_HOURLY_LIMIT:-100}
    BOOKING_EMAIL_REMINDERS: ${BOOKING_EMAIL_REMINDERS:-false}
    SMTP_HOST: mailpit
    SMTP_PORT: 1025
    SMTP_FROM: noreply@stagelink.local
    DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}?connect_timeout=3&pool_timeout=3
    REDIS_URL: redis://redis:6379
    AI_SERVICE_ORIGIN: http://ai:8000
    STRIPE_TEST_SECRET_KEY: ${STRIPE_TEST_SECRET_KEY:-}
    STRIPE_TEST_WEBHOOK_SECRET: ${STRIPE_TEST_WEBHOOK_SECRET:-}
    PAYHERE_SANDBOX_MERCHANT_ID: ${PAYHERE_SANDBOX_MERCHANT_ID:-}
    PAYHERE_SANDBOX_MERCHANT_SECRET: ${PAYHERE_SANDBOX_MERCHANT_SECRET:-}
    PAYHERE_SANDBOX_NOTIFY_URL: ${PAYHERE_SANDBOX_NOTIFY_URL:-}
    WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
  restart: unless-stopped
services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4.12-bookworm
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:56379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    <<: *node
    restart: "no"
    command: ["npm", "run", "db:migrate"]
    depends_on:
      postgres: { condition: service_healthy }
  api:
    <<: *node
    environment:
      <<: *node-env
      STRIPE_TEST_REFUND_EXECUTION: ${STRIPE_TEST_REFUND_EXECUTION:-false}
      PAYHERE_SANDBOX_RETRIEVAL_APP_ID: ${PAYHERE_SANDBOX_RETRIEVAL_APP_ID:-}
      PAYHERE_SANDBOX_RETRIEVAL_APP_SECRET: ${PAYHERE_SANDBOX_RETRIEVAL_APP_SECRET:-}
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:-}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-}
      AI_EMBEDDING_DAILY_LIMIT: ${AI_EMBEDDING_DAILY_LIMIT:-20}
      AI_SEMANTIC_RECOMMENDATIONS: ${AI_SEMANTIC_RECOMMENDATIONS:-false}
      AI_SEMANTIC_DAILY_LIMIT: ${AI_SEMANTIC_DAILY_LIMIT:-20}
      AI_PREVIEW_DAILY_LIMIT: ${AI_PREVIEW_DAILY_LIMIT:-20}
      AI_GENERATION_DAILY_LIMIT: ${AI_GENERATION_DAILY_LIMIT:-20}
    ports: ["127.0.0.1:4000:4000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
  worker:
    <<: *node
    command: ["node", "dist/worker/src/main.js"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
  storage:
    image: adobe/s3mock:5.2.3
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: stagelink-media
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports: ["127.0.0.1:59090:9090"]
    volumes: ["media-data:/s3mockroot"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/favicon.ico"]
      interval: 5s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27.8
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]
  ai:
    image: stagelink-ai:foundation
    build: { context: ../backend/ai }
    init: true
    environment:
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:-}
      AI_OPENAI_API_KEY: ${AI_OPENAI_API_KEY:-}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-}
      AI_OPENAI_MODEL: ${AI_OPENAI_MODEL:-}
      AI_GEMINI_API_KEY: ${AI_GEMINI_API_KEY:-}
      AI_GEMINI_MODEL: ${AI_GEMINI_MODEL:-}
      AI_PREVIEW_PRIMARY_PROVIDER: ${AI_PREVIEW_PRIMARY_PROVIDER:-openai}
      AI_PREVIEW_FALLBACK: ${AI_PREVIEW_FALLBACK:-false}
    # Internal-only service, no browser access or public port.
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
  redis-data:
  media-data:
