log_format stagelink_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
server {
  listen 80;
  access_log /var/log/nginx/access.log stagelink_safe; # Query capabilities are excluded.
  client_max_body_size 40m;
  client_body_timeout 30s;
  root /usr/share/nginx/html;
  index index.html;
  add_header Referrer-Policy no-referrer always;
  add_header X-Content-Type-Options nosniff always;
  resolver 127.0.0.11 valid=10s;
  set $api_upstream api:4000;
  location /api/ {
    proxy_pass http://$api_upstream$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_connect_timeout 3s;
    proxy_read_timeout 65s;
    add_header Cache-Control 'no-store' always;
  }
  location / { try_files $uri $uri/ /index.html; }
}
