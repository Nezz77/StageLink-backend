name: StageLink backend
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_USER: stagelink
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: stagelink_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U stagelink -d stagelink_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.27.8
        ports: ['1025:1025', '8025:8025']
      storage:
        image: adobe/s3mock:5.2.3
        env:
          COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: stagelink-media-test
        ports: ['9090:9090']
        options: >-
          --health-cmd "wget --spider -q http://localhost:9090/favicon.ico"
          --health-interval 5s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7.4.12-bookworm
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      NODE_ENV: test
      AUTH_JWT_SECRET: '0101010101010101010101010101010101010101010101010101010101010101'
      AUTH_MAIL_KEY: '0202020202020202020202020202020202020202020202020202020202020202'
      PAYOUT_DATA_KEY: '0303030303030303030303030303030303030303030303030303030303030303'
      S3_ENDPOINT: http://127.0.0.1:9090
      S3_BUCKET: stagelink-media-test
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 1025
      MAILPIT_API_URL: http://127.0.0.1:8025
      DATABASE_URL: postgresql://stagelink:isolated-ci-only@127.0.0.1:5432/stagelink_test?connect_timeout=3
      REDIS_URL: redis://127.0.0.1:6379
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg poppler-utils fonts-dejavu-core util-linux
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run db:migrate # Re-running deploy must be safe.
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run contracts
      - run: git diff --exit-code -- ../contracts/openapi.json ../packages/contracts/src/api.d.ts
      - run: node backend/scripts/setup-env.mjs && docker compose --env-file infra/.env -f infra/compose.backend.yml config --quiet
        working-directory: .
      - run: docker build -f backend/Dockerfile -t stagelink-backend:ci .
        working-directory: .
  python:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.29'
      - run: uv sync --frozen
      - run: uv run --frozen pytest -q
      - run: docker build -t stagelink-ai:ci .
